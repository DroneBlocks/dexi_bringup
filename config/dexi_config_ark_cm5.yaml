# ARK carrier + CM5 platform defaults.
#
# The camera is a Pi Camera 2.1 (IMX219) on CAM0. 640x480 matches
# dexi_camera/config/picam_2.1_csi.yaml, which is calibrated at exactly that
# resolution — a mismatch silently biases every AprilTag range.
#
# Servos and GPIO are off: the PCA9685 and TCA9555 are not on this carrier
# (i2c-1 scans empty), and a Pixhawk drives PWM directly.
#
# Loaded by scripts/start.bash on top of dexi_config.yaml. Only overrides here.

nodes:
  camera:
    width: 640
    height: 480
  servos:
    enabled: false
  gpio:
    enabled: false
