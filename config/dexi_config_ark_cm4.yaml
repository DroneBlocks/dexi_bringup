# ARK carrier + CM4 platform defaults.
#
# The camera is a Pi Camera 2.1 (IMX219). 640x480 matches the calibration the
# launch file loads; a resolution mismatch silently biases every AprilTag range.
#
# Servos and GPIO are off: the PCA9685 and TCA9555 are not on this carrier, and
# a Pixhawk drives PWM directly.
#
# Note the key is "servo", singular — start.bash reads nodes.servo.enabled.
#
# Loaded by scripts/start.bash on top of dexi_config.yaml. Only overrides here.

nodes:
  camera:
    width: 640
    height: 480
  servo:
    enabled: false
  gpio:
    enabled: false

  # Off by default. `model` names a profile in dexi_yolo's models/models.yaml:
  # avr_2026, avr_2025 or coco. A path works too, and then `classes` is
  # required and must be in training order.
  yolo:
    enabled: false
    model: avr_2026
    detection_frequency: 2.0
    # 2 threads, measured on an ARK CM4 at 2 Hz: 415 ms/frame on 1 thread
    # against 262 ms on 2, for 0.83 vs 1.05 cores. One thread leaves 85 ms of
    # slack in the 500 ms budget, two leaves 238 ms. Three and four are worse
    # than two (309 ms, 456 ms) because they contend with the rest of the stack.
    num_threads: 2
