# CM4 platform defaults.
#
# CM4 DEXI drones use the Raspberry Pi CSI camera via camera_ros /
# libcamera, which does ISP-level resize so any output size works.
# Defaults chosen to match historical CM4 deployment (640x480 via the
# 1640x1232 2x2-binned sensor mode, see dexi_bringup_ark_cm4.launch.py).
#
# This file is loaded by scripts/start.bash *on top of* the shared
# dexi_config.yaml base. Only per-platform overrides belong here.

nodes:
  camera:
    width: 640
    height: 480

  # No PCA9685 here either. This platform shares the ark_cm4 bringup, whose
  # servo node drives pigpio PWM directly, but the chip and the hat it sits
  # on belong to the Pi 5.
  servo:
    enabled: false

  # Off by default. `model` names a profile in dexi_yolo's models/models.yaml:
  # avr_2026, avr_2025 or coco. A path works too, and then `classes` is
  # required and must be in training order.
  yolo:
    enabled: false
    model: avr_2026
    detection_frequency: 2.0
    num_threads: 1
